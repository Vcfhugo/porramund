<script>
  (function () {
    var swallow = function (e) {
      var m = (e && (e.message || (e.reason && e.reason.message))) || '';
      if (typeof m === 'string' && m.indexOf('ResizeObserver') !== -1) {
        e.stopImmediatePropagation && e.stopImmediatePropagation();
        e.preventDefault && e.preventDefault();
        return false;
      }
    };
    window.addEventListener('error', swallow, true);
    var _err = console.error;
    console.error = function () {
      var a = arguments[0];
      if (typeof a === 'string' && a.indexOf('ResizeObserver') !== -1) return;
      return _err.apply(console, arguments);
    };
  })();
</script>

  <script>
    // Auto-redirect desktop users to web view
    if (window.innerWidth >= 1024 && !window.location.search.includes('mobile')) {
      window.location.replace('/web');
    }

    // Detect real touch device — skip the iOS mockup frame
    window.IS_REAL_MOBILE = window.matchMedia('(max-width: 768px) and (pointer: coarse)').matches;

    if (!window.IS_REAL_MOBILE) {
      function fitDevice() {
        const W = 402, H = 874, margin = 40;
        const sx = (window.innerWidth  - margin) / W;
        const sy = (window.innerHeight - margin) / H;
        const s  = Math.min(sx, sy, 1.15);
        const el = document.getElementById('device-wrap');
        if (el) el.style.transform = 'scale(' + s + ')';
      }
      window.addEventListener('resize', fitDevice);
      fitDevice();
      const _fit = setInterval(fitDevice, 400);
      setTimeout(() => clearInterval(_fit), 3000);
    }
  </script>
