  <line x1="350" y1="173" x2="322" y2="193" stroke="#FDD301" stroke-width="14" stroke-linecap="round"/>
  <line x1="313" y1="312" x2="293" y2="286" stroke="#FDD301" stroke-width="14" stroke-linecap="round"/>
  <line x1="199" y1="312" x2="219" y2="286" stroke="#FDD301" stroke-width="14" stroke-linecap="round"/>
  <line x1="162" y1="173" x2="190" y2="193" stroke="#FDD301" stroke-width="14" stroke-linecap="round"/>
  <!-- Texto "2026" abajo -->
